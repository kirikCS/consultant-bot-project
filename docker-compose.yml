services:
  embedder:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --model /models/nomic-embed-text-v1.5.Q4_K_M.gguf
      --host 0.0.0.0
      --port 8081
      --embedding
      --pooling mean
      -c 2048
      --threads 2
    volumes:
      - ./models/nomic-embed-text-v1.5.Q4_K_M.gguf:/models/nomic-embed-text-v1.5.Q4_K_M.gguf:ro
    ports:
      - "127.0.0.1:18081:8081"
    mem_limit: 500m
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    environment:
      - EMBEDDER_URL=http://embedder:8081
      - MED_SERVICES_PATH=/app/data/med_services.json
      - INDICES_DIR=/app/indices
      - SQLITE_PATH=/app/data/bot.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./med_services.json:/app/data/med_services.json:ro
      - ./indices:/app/indices
      - ./data:/app/data
    depends_on:
      - embedder
    mem_limit: 700m
    restart: unless-stopped
